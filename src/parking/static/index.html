<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Parking Management</title>
<link rel="stylesheet" href="/static/styles.css">
<link rel="icon" href="data:,">
</head>
<body>
<header>
  <h1>Smart Parking</h1>
  <div class="lot-picker">
    <select id="lotSelect"></select>
    <button id="refreshBtn" title="Refresh">↻</button>
  </div>
</header>

<main>
  <section class="cards" id="reportCards"></section>

  <section class="panel">
    <h2>Lots</h2>
    <form id="lotForm">
      <input id="lotName" placeholder="Lot name" required>
      <input id="lotRate" type="number" min="1" step="0.01" placeholder="Rate/hr" value="50">
      <button type="submit">Add lot</button>
    </form>
    <form id="slotForm">
      <input id="slotCodes" placeholder="Slot codes, e.g. A1 A2 A3" required>
      <button type="submit">Add slots</button>
    </form>
  </section>

  <section class="panel">
    <h2>Vehicle entry / exit</h2>
    <form id="entryForm">
      <input id="entryPlate" placeholder="Plate number" required>
      <button type="submit">Park (entry)</button>
    </form>
    <form id="exitForm">
      <input id="exitPlate" placeholder="Plate number" required>
      <button type="submit">Checkout (exit)</button>
    </form>
    <p id="opMsg" class="msg"></p>
  </section>

  <section class="panel">
    <h2>Slots</h2>
    <div id="slotGrid" class="slots"></div>
  </section>

  <section class="panel">
    <h2>Parked now</h2>
    <table id="activeTable">
      <thead><tr><th>Plate</th><th>Slot</th><th>Since</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
